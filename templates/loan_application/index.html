<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Loan Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
        }
        .header {
            margin-bottom: 30px;
        }
        .card {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header text-center">
            <h1>CRM Loan Management System</h1>
            <p class="lead">A comprehensive solution for managing loan applications</p>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">New Loan Application</h5>
                    </div>
                    <div class="card-body">
                        <form id="loanApplicationForm">
                            <h5>Borrower Information</h5>
                            <div class="mb-3">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob" required>
                            </div>
                            <div class="mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" required>
                            </div>

                            <h5 class="mt-4">Loan Details</h5>
                            <div class="mb-3">
                                <label for="product" class="form-label">Loan Product</label>
                                <select class="form-select" id="product" required>
                                    <option value="">Select a product</option>
                                    <option value="1">Residential Mortgage</option>
                                    <option value="2">Commercial Property Loan</option>
                                    <option value="3">Construction Loan</option>
                                    <option value="4">Bridge Loan</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="grossAmount" class="form-label">Gross Loan Amount</label>
                                <input type="number" class="form-control" id="grossAmount" required>
                            </div>
                            <div class="mb-3">
                                <label for="netAmount" class="form-label">Net Loan Amount</label>
                                <input type="number" class="form-control" id="netAmount" required>
                            </div>
                            <div class="mb-3">
                                <label for="broker" class="form-label">Broker (Optional)</label>
                                <select class="form-select" id="broker">
                                    <option value="">Select a broker</option>
                                    <option value="1">John Smith</option>
                                    <option value="2">Jane Doe</option>
                                    <option value="3">Robert Johnson</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary">Submit Application</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0">Recent Applications</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Borrower</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="applicationsList">
                                    <tr>
                                        <td colspan="5" class="text-center">Loading applications...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card mt-4">
                    <div class="card-header bg-info text-white">
                        <h5 class="card-title mb-0">System Status</h5>
                    </div>
                    <div class="card-body">
                        <p><strong>API Status:</strong> <span class="badge bg-success">Online</span></p>
                        <p><strong>Database:</strong> <span class="badge bg-success">Connected</span></p>
                        <p><strong>Last Update:</strong> <span id="lastUpdate">Loading...</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set current date for last update
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
            
            // Handle form submission
            document.getElementById('loanApplicationForm').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Application submitted successfully! This is a demo template.');
            });
            
            // Simulate loading applications
            setTimeout(function() {
                const sampleData = [
                    { id: 1001, borrower: 'Michael Brown', amount: '$250,000', status: 'Approved' },
                    { id: 1002, borrower: 'Sarah Wilson', amount: '$175,000', status: 'Under Review' },
                    { id: 1003, borrower: 'David Lee', amount: '$320,000', status: 'Submitted' },
                    { id: 1004, borrower: 'Emily Clark', amount: '$195,000', status: 'Draft' }
                ];
                
                const tableBody = document.getElementById('applicationsList');
                tableBody.innerHTML = '';
                
                sampleData.forEach(app => {
                    let statusClass = 'bg-secondary';
                    if (app.status === 'Approved') statusClass = 'bg-success';
                    if (app.status === 'Under Review') statusClass = 'bg-warning';
                    if (app.status === 'Submitted') statusClass = 'bg-info';
                    
                    tableBody.innerHTML += `
                        <tr>
                            <td>${app.id}</td>
                            <td>${app.borrower}</td>
                            <td>${app.amount}</td>
                            <td><span class="badge ${statusClass}">${app.status}</span></td>
                            <td><button class="btn btn-sm btn-outline-primary">View</button></td>
                        </tr>
                    `;
                });
            }, 1000);
        });
    </script>
</body>
</html>
